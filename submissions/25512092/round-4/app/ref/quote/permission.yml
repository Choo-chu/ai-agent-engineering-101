name: quote
description: 손님 응대 1단계. args {customer_key: 손님 이름(대기 메시지 from의 '...' 안), query: 손님이 찾는 말}. shop_handler와 같은 매칭(상품명만, 불용어·숫자 시작 말 제외, 맞은 단어 수 > 손님이 말한 등급 > 싼 것, '임박 말고/신선한 거'면 임박 제외)으로 1개를 골라 가격을 정하고 offers[손님]={sku, price, unit, grade, ts}에 저장. 반환 {ok, sku, name, grade, price, expires_h, others, say}. say를 그대로 reply. '말고/빼고' 앞 품목 제외. 맞는 상품이 없으면 ok=false와 '그 상품은 지금 없습니다' + 대체품 이름만.
permission:
  network: [market.ourolabs.ai]
  write: [handler_state.json, test_state.json]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
