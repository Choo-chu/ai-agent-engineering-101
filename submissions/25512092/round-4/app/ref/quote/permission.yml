name: quote
description: 손님 응대 1단계. args {customer_key: 손님 이름(대기 메시지 from의 '...' 안), query: 손님이 찾는 말}. 재고에서 관련 상품 1개를 골라(임박 특가 > 신선 > 기타, 같은 우선순위면 싼 것) 가격을 정하고 offers[손님]={sku, price, unit, grade, ts}에 저장한다. 반환 {ok, sku, name, grade, price, expires_h, others, say}. say를 그대로 reply하면 된다. '말고/빼고' 앞 품목은 제외. 맞는 상품이 없으면 다른 상품을 권하지 않고 ok=false와 '그 상품은 지금 없습니다' + 대체품 이름만.
permission:
  network: [market.ourolabs.ai]
  write: [handler_state.json, test_state.json]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
