name: quote
description: 손님 응대 1단계. args {customer_key: 손님 이름(대기 메시지 from의 '...' 안), query: 손님이 찾는 말}. shop_handler와 같은 매칭·조건(상품명 단어 10점, 일반어 1점, 우리 SKU 100점, 등급·기한 조건 필터, 같으면 싼 것)으로 1개를 골라 가격을 정하고 offers[손님]={sku, price, unit, grade, ts}에 저장. 반환 {ok, sku, name, grade, price, expires_h, others, say}. say를 그대로 reply. '말고/빼고' 앞 품목 제외. 맞는 상품이 없으면 ok=false와 '그 상품은 지금 없습니다' + 대체품 이름만. 조건에 맞는 unit이 없으면 ok=false와 '조건에 맞는 재고가 없습니다' + 지금 있는 등급·기한.
permission:
  network: [market.ourolabs.ai]
  write: [handler_state.json, test_state.json]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
