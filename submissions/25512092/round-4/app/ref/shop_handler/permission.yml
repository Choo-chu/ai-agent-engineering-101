name: shop_handler
description: A2A 핸들러. 손님(claimed_from)에게 30분 안의 offer가 있고 메시지가 수락이면 offer에 저장된 unit(미예약·만료 전일 때), 아니면 만료가 가장 빠른 미예약 unit을 10분 예약하고(그 unit의 min_price 미만이면 defer) 가게 지갑으로 서명한 checkout_jwt를 data로 돌려준다. 그 밖의 메시지는 모두 defer.
permission:
  network: [market.ourolabs.ai]
  write: [handler_state.json, ledger.jsonl, test_state.json, test_ledger.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
