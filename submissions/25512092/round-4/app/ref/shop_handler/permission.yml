name: shop_handler
description: A2A 핸들러(첫 답에 결제서). 손님 단어를 상품명과만 매칭(불용어·숫자로 시작하는 말 제외). 점수는 상품명 단어 10점, 일반어(나물·채소·과일·고기 등) 1점, 우리 SKU 언급 100점(괄호·SKU는 단어에서 뗌). 남의 SKU를 말하면 20점 이상만. 'A등급/B등급 이상/C등급 제외'·'임박 제외/넉넉'·'N시간 이하 제외'는 조건 필터: 최고 점수 상품에 조건 맞는 unit이 없으면 defer(defer_cond). 같으면 싼 것. 제안가로 unit을 10분 예약하고 가게 지갑 서명 checkout_jwt를 reply와 함께 낸다(손님당 예약 1개). 같은 상품 예약이 살아 있으면 기존 결제서 재안내. '말고/빼고' 앞 품목 제외. 조건이 아닌 거절 문장(않겠·안 살·아니·필요 없·취소·환불·보류)이면 그 손님 예약 해제 후 defer. 조건절(전에는·없는·안 되면 등)은 매칭에서 뺀다. 손님 품목 단어(식품 카탈로그 단어) 중 우리 재고에 맞은 비율이 절반 이하면 defer(상품명 앞부분이 다 있으면 인정). 손님 원문·상품·결과를 ledger에 기록.
permission:
  network: [market.ourolabs.ai]
  write: [handler_state.json, ledger.jsonl, test_state.json, test_ledger.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
